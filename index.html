<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CallJuCri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Concepto: consola de operaciones de una planta telefónica. Tira de troncales arriba, una sala a la vez, solución que se despliega paso a paso y laboratorios con deslizadores. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --panel2:#e6ebef; --fg:#14212b; --muted:#566774; --line:#c8d3db;
  --accent:#0b6f6a; --accent-fg:#ffffff; --alarm:#c2410c; --ok:#1b7a3a; --bar:#a3b3be; --warn:#b45309;
  --f-display:'Space Grotesk',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1820; --panel:#16232e; --panel2:#1d2f3d; --fg:#e5edf3; --muted:#92a5b3; --line:#2b3f4f;
    --accent:#4cc2b9; --accent-fg:#06201e; --alarm:#ff8b5a; --ok:#62d08a; --bar:#42596a; --warn:#f0b35a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1820; --panel:#16232e; --panel2:#1d2f3d; --fg:#e5edf3; --muted:#92a5b3; --line:#2b3f4f;
  --accent:#4cc2b9; --accent-fg:#06201e; --alarm:#ff8b5a; --ok:#62d08a; --bar:#42596a; --warn:#f0b35a; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0}
p{margin:0 0 12px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.bar .gut{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:10px}
.brand{font:700 18px var(--f-display);letter-spacing:.01em}
.brand small{display:block;font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer{display:flex;align-items:baseline;gap:8px;font-family:var(--f-mono)}
.timer span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.timer b{font-size:22px;font-variant-numeric:tabular-nums}
.timer.low b{color:var(--alarm)}
.demo{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.big{padding:13px 22px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px}

main.gut{padding-block:26px 64px}

/* tira de salas */
.strip{display:flex;margin:0 0 10px}
.node{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:4px 0;cursor:pointer;position:relative;font:600 12px var(--f-mono);color:var(--muted)}
.node::before{content:"";position:absolute;top:16px;right:50%;width:100%;height:2px;background:var(--line)}
.node:first-child::before{display:none}
.node.ok::before{background:var(--ok)}
.dot{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:11px;transition:transform .15s}
.node:not(:disabled):hover .dot{transform:scale(1.12)}
.node.ok .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.node.cur .dot{border-color:var(--alarm);box-shadow:0 0 0 4px color-mix(in srgb,var(--alarm) 22%,transparent)}
.node.cur.ok .dot{border-color:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.node.cur:not(.ok) .dot{animation:pulse 1.4s ease-in-out infinite}
.node:disabled{cursor:not-allowed;opacity:.55}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--alarm) 6%,transparent)}}
.prog{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:500 12px var(--f-mono);color:var(--muted)}
.prog .track{flex:1;height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .7s ease}
.keys{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 26px;font:500 12px var(--f-mono);color:var(--muted)}
.key{font:600 14px var(--f-mono);padding:3px 10px;border:1px solid var(--ok);border-radius:6px;background:var(--panel);color:var(--fg)}
.key.empty{border:1px dashed var(--line);color:var(--muted)}

/* sala */
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.room h1{font-size:clamp(28px,5vw,40px);line-height:1.1}
.sub{color:var(--muted);margin:6px 0 20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{font:500 12px var(--f-mono);padding:2px 10px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}
.chip.lvl{color:var(--fg)}
.problem{max-width:70ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
.scroll{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl.mono td{font-family:var(--f-mono)}
.block{margin:22px 0}
.block h3{font-size:15px;margin-bottom:8px}

.hints{display:flex;flex-direction:column;gap:8px;margin:18px 0}
.hint{background:var(--panel2);border-radius:8px;padding:10px 14px;animation:rise .3s ease both}
.hint b{display:block;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.hintbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.answer{margin-top:22px;max-width:520px}
.answer label{display:block;font-weight:600;margin-bottom:4px}
.answer .help{font-size:13px;color:var(--muted);margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{flex:1 1 200px;min-width:0;font:600 22px var(--f-mono);letter-spacing:.12em;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
input[type=text]:disabled{opacity:.5}
.att{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.att span{display:flex;gap:5px}
.att i{width:10px;height:10px;border-radius:50%;background:var(--alarm)}
.att i.off{background:var(--line)}
.att .cnt{margin-left:auto;font-family:var(--f-mono)}
.msg{min-height:22px;margin-top:8px;font-size:14px;color:var(--alarm)}
.msg.lock{color:var(--warn);font-weight:600}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{0%{transform:scale(.97);opacity:.4}60%{transform:scale(1.015)}}

.okbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 20px;background:var(--panel);border:1px solid var(--ok);border-radius:8px;padding:14px 18px;margin:22px 0}
.okbar.pop{animation:pop .45s ease}
.okbar p{margin:0;font-weight:600}
.okbar .big{font:700 30px var(--f-mono);letter-spacing:.1em;color:var(--ok)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px}
.steps li.new{animation:rise .4s ease both}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font:600 12px var(--f-mono);color:var(--muted);margin-top:2px}
.steps li>div{min-width:0}
.steps h3{font-size:14px;margin-bottom:4px}
.stepbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.math{font:500 15px/1.9 var(--f-mono);background:var(--panel2);border-radius:6px;padding:8px 12px;overflow-x:auto;white-space:nowrap}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px;line-height:1.4}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 4px}
.solution{margin-top:6px}
.nav{display:flex;justify-content:flex-end;margin-top:26px}

svg.ch{width:100%;max-width:580px;height:auto;display:block;overflow:visible}
svg .bar{fill:var(--bar);transition:fill .15s}
svg .bar:hover{fill:var(--accent);opacity:.8}
svg .bar.hl{fill:var(--accent)}
svg .ct{fill:var(--muted);font:11px var(--f-mono)}
svg .ct.cv{fill:var(--fg);font-weight:600;font-size:12px}
svg .axis{stroke:var(--line);stroke-width:1}
svg .curve{fill:none;stroke:var(--fg);stroke-width:1.6}
svg .shade{fill:var(--accent);opacity:.55}
svg .ref{stroke:var(--alarm);stroke-width:1.5;stroke-dasharray:4 3}
svg .pt{fill:var(--accent);opacity:.7}
svg .refline{stroke:var(--alarm);stroke-width:1.5}
.cap{font-size:13px;color:var(--muted);margin:6px 0 0}

/* laboratorios */
.lab{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:22px 0;max-width:800px}
.lab>h3{font-size:16px;margin-bottom:10px}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 22px;margin-bottom:12px}
.ctrl label{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-bottom:4px}
.ctrl label b{color:var(--fg);font-family:var(--f-mono)}
input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
.labout{font-size:14px;margin:6px 0 12px;min-height:22px}
.labout b{font-family:var(--f-mono)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0 10px}
.stat{background:var(--panel2);border-radius:8px;padding:8px 12px}
.stat span{display:block;font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.stat b{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums}
.verdict{border-radius:8px;padding:10px 12px;font-weight:600;margin:8px 0 14px;background:var(--panel2)}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--alarm)}
.twoup{display:flex;flex-wrap:wrap;gap:18px}
.twoup>div{flex:1 1 250px;min-width:0}

/* intro */
.status{display:inline-flex;align-items:center;gap:8px;font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--alarm);margin-bottom:14px}
.status i{width:9px;height:9px;border-radius:50%;background:var(--alarm);animation:pulse 1.4s ease-in-out infinite}
.hero h1{font-size:clamp(38px,8vw,72px);line-height:1;letter-spacing:-.01em;margin-bottom:16px}
.hero .lead{font-size:18px;max-width:56ch;color:var(--muted);margin-bottom:22px}
.cta{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;margin-bottom:34px}
.cta .chips{margin:0}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer}
.pill:hover{border-color:var(--accent)}
.pill[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px 28px;align-items:start;margin-bottom:6px}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.split .problem{max-width:none}
.fx{background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:14px 16px}
.fx .eyebrow{color:var(--accent);margin-bottom:8px}
.fx .math{margin:0 0 8px}
.fx dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;color:var(--muted)}
.fx dt{font:600 13px var(--f-mono);color:var(--fg)}
.fx dd{margin:0}
.concl{margin:26px 0}
.concl h2{font-size:22px;margin-bottom:10px}
.concl ul{margin:0;padding-left:20px;max-width:75ch}
.concl li{margin-bottom:8px}
.txt{max-width:72ch}
.txt h4{font-size:14px;margin:16px 0 6px}
.txt ul,.txt ol{padding-left:20px;margin:0 0 14px}
.txt li{margin-bottom:6px}
.simple{background:var(--panel2);border-radius:8px;padding:10px 14px;margin:0 0 14px}
.cpt h3{font-size:22px;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-bottom:18px}
.cards .panel h3{font-size:16px;margin-bottom:8px}
.cards .panel ul{padding-left:18px;margin:0 0 6px}
.credits{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font:400 12px/1.7 var(--f-mono);color:var(--muted)}

.modal{position:fixed;inset:0;z-index:40;background:rgba(5,12,18,.6);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:10px;width:100%;max-width:880px;max-height:100%;overflow:auto;padding:18px}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sheet h2{font-size:20px}

/* final y fin */
.final-keys{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.win h1{font-size:clamp(32px,6vw,52px);line-height:1.05;margin-bottom:10px}
.bigkey{font:700 clamp(15px,3.6vw,26px) var(--f-mono);letter-spacing:.08em;color:var(--ok);word-break:break-all;margin:6px 0 4px}
.lights{display:flex;gap:10px;margin:0 0 18px}
.lights i{width:16px;height:16px;border-radius:50%;background:var(--ok);animation:light .5s ease both}
.lights i:nth-child(2){animation-delay:.3s}.lights i:nth-child(3){animation-delay:.6s}.lights i:nth-child(4){animation-delay:.9s}.lights i:nth-child(5){animation-delay:1.2s}
@keyframes light{from{background:var(--alarm);transform:scale(.7)}60%{transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){
  .node.cur:not(.ok) .dot,.status i,.hint,.steps li.new,.okbar.pop,.shake,.lights i{animation:none}
  .prog i,.dot,svg .bar{transition:none}
}
</style>

<header class="bar">
  <div class="gut">
    <div class="brand">CallJuCri<small>Escape room estadístico</small></div>
    <div class="tools">
      <div class="timer" id="timerbox" hidden><span>Tiempo</span><b id="timer">25:00</b></div>
      <label class="demo" for="demo"><input type="checkbox" id="demo"> Modo demo</label>
      <button class="btn sm" data-act="manual" type="button">Manual</button>
    </div>
  </div>
</header>
<main class="gut" id="app"></main>
<div class="modal" id="modal" hidden></div>

<script>
(function(){
'use strict';
var TOTAL=25*60*1000;

/* ---------- utilidades ---------- */
function fmt(x,d){return x.toFixed(d==null?4:d).replace('.',',');}
function sg(s){return s.replace('-','−');}
function fn(x){return (Math.round(x*10)/10).toString().replace('.',',');}
function Cb(n,k){if(k<0||k>n)return 0;var r=1;for(var i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r);}

function m(h){return '<div class="math">'+h+'</div>';}

  var a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],
      b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],
      c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],
      d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416],q,r;
  if(p<0.02425){q=Math.sqrt(-2*Math.log(p));return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p>1-0.02425){q=Math.sqrt(-2*Math.log(1-p));return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}

}

  var n=arr.length,s=0,i,d;for(i=0;i<n;i++)s+=arr[i];

}

/* ---------- gráficas ---------- */
function bars(o){
  var w=o.w||560,h=o.h||190,pL=10,pR=10,pT=24,pB=28,n=o.vals.length,mx=Math.max.apply(null,o.vals),
      bw=(w-pL-pR)/n,ph=h-pT-pB,s='<svg class="ch" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+o.aria+'">';
  o.vals.forEach(function(v,i){
    var bh=mx?v/mx*ph:0,x=pL+i*bw+bw*0.15,y=pT+ph-bh,cx=x+bw*0.35,hl=(i===o.hl);
    s+='<rect class="bar'+(hl?' hl':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*0.7).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2"><title>'+(o.tip?o.tip(i,v):o.labels[i]+': '+o.fv(v))+'</title></rect>';
    if(o.all||hl)s+='<text class="ct'+(hl?' cv':'')+'" x="'+cx.toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle">'+o.fv(v)+'</text>';
    s+='<text class="ct" x="'+cx.toFixed(1)+'" y="'+(h-9)+'" text-anchor="middle">'+o.labels[i]+'</text>';
  });
  s+='<line class="axis" x1="'+pL+'" x2="'+(w-pR)+'" y1="'+(pT+ph)+'" y2="'+(pT+ph)+'"/></svg>';
  return s;
}
function curve(o){
  var w=560,h=210,L=16,R=16,T=18,B=32,N=200,i,x,d='',sh='',
      X=function(v){return L+(v-o.x0)/(o.x1-o.x0)*(w-L-R);},
      Y=function(v){return T+(1-v/o.ymax)*(h-T-B);};
  for(i=0;i<=N;i++){x=o.x0+(o.x1-o.x0)*i/N;d+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(o.f(x)).toFixed(1);}
  var sa=Math.max(o.sa,o.x0),sb=Math.min(o.sb,o.x1);
  if(sb>sa){sh='M'+X(sa).toFixed(1)+' '+Y(0).toFixed(1);for(i=0;i<=N;i++){x=sa+(sb-sa)*i/N;sh+='L'+X(x).toFixed(1)+' '+Y(o.f(x)).toFixed(1);}sh+='L'+X(sb).toFixed(1)+' '+Y(0).toFixed(1)+'Z';}
  var s='<svg class="ch" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+o.aria+'">';
  s+=(sh?'<path class="shade" d="'+sh+'"/>':'')+'<path class="curve" d="'+d+'"/>';
  s+='<line class="axis" x1="'+L+'" x2="'+(w-R)+'" y1="'+Y(0)+'" y2="'+Y(0)+'"/>';
  o.ticks.forEach(function(t){
    s+='<line class="axis" x1="'+X(t).toFixed(1)+'" x2="'+X(t).toFixed(1)+'" y1="'+Y(0)+'" y2="'+(Y(0)+4)+'"/>';
    s+='<text class="ct" x="'+X(t).toFixed(1)+'" y="'+(h-10)+'" text-anchor="middle">'+o.tl(t)+'</text>';
  });
  if(o.sa>o.x0)s+='<line class="ref" x1="'+X(o.sa).toFixed(1)+'" x2="'+X(o.sa).toFixed(1)+'" y1="'+(T+4)+'" y2="'+Y(0)+'"/>';
  if(o.sb<o.x1)s+='<line class="ref" x1="'+X(o.sb).toFixed(1)+'" x2="'+X(o.sb).toFixed(1)+'" y1="'+(T+4)+'" y2="'+Y(0)+'"/>';
  s+='<text class="ct cv" x="'+(w-R)+'" y="'+(T+14)+'" text-anchor="end">'+o.l1+'</text>';
  s+='<text class="ct cv" x="'+(w-R)+'" y="'+(T+30)+'" text-anchor="end">'+o.l2+'</text></svg>';
  return s;
}
function qq(zs){
  var w=300,h=270,L=38,R=12,T=12,B=40,lim=4,n=zs.length,i,
      X=function(v){return L+(v+lim)/(2*lim)*(w-L-R);},Y=function(v){return T+(1-(v+lim)/(2*lim))*(h-T-B);},
      s='<svg class="ch" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Gráfico Q-Q: cuantiles teóricos contra datos estandarizados">';
  s+='<line class="axis" x1="'+L+'" x2="'+L+'" y1="'+T+'" y2="'+(h-B)+'"/><line class="axis" x1="'+L+'" x2="'+(w-R)+'" y1="'+(h-B)+'" y2="'+(h-B)+'"/>';
  for(i=-3;i<=3;i+=1){
    s+='<text class="ct" x="'+X(i)+'" y="'+(h-B+14)+'" text-anchor="middle">'+i+'</text><text class="ct" x="'+(L-6)+'" y="'+(Y(i)+4)+'" text-anchor="end">'+i+'</text>';
  }
  s+='<line class="refline" x1="'+X(-lim)+'" y1="'+Y(-lim)+'" x2="'+X(lim)+'" y2="'+Y(lim)+'"/>';
  for(i=0;i<n;i++){var th=invNorm((i+0.5)/n),yv=Math.max(-lim,Math.min(lim,zs[i]));s+='<circle class="pt" cx="'+X(th).toFixed(1)+'" cy="'+Y(yv).toFixed(1)+'" r="2.4"/>';}
  s+='<text class="ct" x="'+((L+w-R)/2)+'" y="'+(h-8)+'" text-anchor="middle">Cuantiles de una normal</text>';
  s+='<text class="ct" x="10" y="'+((T+h-B)/2)+'" text-anchor="middle" transform="rotate(-90 10 '+((T+h-B)/2)+')">Datos (estandarizados)</text></svg>';
  return s;
}

/* ---------- modelos ---------- */
function binomChart(p,k){var v=[],l=[],i;for(i=0;i<=5;i++){v.push(Cb(5,i)*Math.pow(p,i)*Math.pow(1-p,5-i));l.push(String(i));}
  return bars({vals:v,labels:l,hl:k,fv:function(x){return fmt(x);},tip:function(i,x){return 'k = '+i+': '+fmt(x);},aria:'Distribución binomial con n = 5 y p = '+fmt(p,2)});}
function hyperChart(K,k){var v=[],l=[],i;for(i=0;i<=4;i++){v.push(Cb(K,i)*Cb(12-K,4-i)/Cb(12,4));l.push(String(i));}
  return bars({vals:v,labels:l,hl:k,all:true,fv:function(x){return fmt(x);},tip:function(i,x){return 'k = '+i+': '+fmt(x);},aria:'Distribución hipergeométrica con N = 12, K = '+K+' y n = 4'});}
function poisChart(lam,k){var top=Math.min(24,Math.max(12,Math.ceil(lam+4*Math.sqrt(lam)))),v=[],l=[],i;
  for(i=0;i<=top;i++){v.push(Math.exp(-lam)*Math.pow(lam,i)/fact(i));l.push(String(i));}
  return bars({vals:v,labels:l,hl:(k<=top?k:-1),fv:function(x){return fmt(x);},tip:function(i,x){return 'k = '+i+': '+fmt(x);},aria:'Distribución de Poisson con lambda = '+fn(lam)});}
function expChart(mean,t){var lam=1/mean,x1=mean<=2?10:Math.ceil(mean)*5,st=x1<=10?2:5,tk=[],i;
  for(i=0;i<=x1;i+=st)tk.push(i);
  return curve({f:function(x){return lam*Math.exp(-lam*x);},x0:0,x1:x1,ymax:lam,sa:t,sb:x1,ticks:tk,tl:function(v){return v;},
    l1:'t = '+fn(t)+' min',l2:'Área = '+fmt(Math.exp(-lam*t)),aria:'Curva exponencial con promedio de '+fn(mean)+' minutos; área a la derecha de t = '+fn(t)});}
function normChart(mu,s,x,mode,o){
  o=o||{};var x0=mu-4*s,x1=mu+4*s,ticks=o.ticks,j,sa,sb,l1,l2,area;
  if(!ticks){ticks=[];for(j=-3;j<=3;j++)ticks.push(mu+j*s);}
  if(mode==='cola'){var z=Math.round((x-mu)/s*100)/100;sa=x;sb=x1;area=Qn(z);l1='x = '+fn(x)+(o.unit?' '+o.unit:'')+' (Z = '+fmt(z,2)+')';l2='Área = '+fmt(area);}
  else{var k=+mode;sa=mu-k*s;sb=mu+k*s;area=1-2*Qn(k);l1='μ ± '+k+'σ';l2='Área = '+fmt(area);}
  return curve({f:function(v){return Math.exp(-(v-mu)*(v-mu)/(2*s*s));},x0:x0,x1:x1,ymax:1.08,sa:sa,sb:sb,ticks:ticks,tl:fn,l1:l1,l2:l2,aria:'Curva normal con promedio '+fn(mu)+' y desviación '+fn(s)});}

    aria:'Histograma del jitter: frecuencias 2, 7, 16, 20, 16, 7, 2, simétrico con centro en la clase 30 a 35'});

var DS=null;
function datasets(){
  if(DS)return DS;
  var n=200,i,a,r;
  r=rng32(7);a=[];for(i=0;i<n;i++)a.push(Math.round((50+10*gauss(r))*10)/10);var nor=a;
  r=rng32(11);a=[];for(i=0;i<n;i++)a.push(Math.round(-2*Math.log(1-r())*10)/10);var der=a;
  r=rng32(5);a=[];for(i=0;i<n;i++){var g=gauss(r);a.push(Math.round((50+10*(r()<0.85?g:3.2*g))*10)/10);}var pes=a;
  r=rng32(3);a=[];for(i=0;i<n;i++)a.push(Math.round((20+60*r())*10)/10);var uni=a;
  function mk(id,name,desc,v,hist){var st=moments(v);return {id:id,name:name,desc:desc,v:v,st:st,hist:hist||makeHist(st.sorted)};}
  function makeHist(so){var nb=12,mn=so[0],mx=so[so.length-1],wd=(mx-mn)/nb||1,c=[],l=[],k,dec=(mx-mn)>30?0:1;
    for(k=0;k<nb;k++)c.push(0);
    so.forEach(function(v){var b=Math.min(nb-1,Math.floor((v-mn)/wd));c[b]++;});
    for(k=0;k<nb;k++)l.push((mn+wd*(k+0.5)).toFixed(dec).replace('.',','));
    return {vals:c,labels:l};}
  DS={
    jit:mk('jit','Jitter de CallJuCri','Los 70 paquetes de la sala 5. Como están agrupados, se usan las marcas de clase.',JITV,{vals:JIT.map(function(r){return r[1];}),labels:JIT.map(function(r){return r[2];})}),
    nor:mk('nor','Campana (normal)','Datos simulados de una distribución normal, para comparar.',nor),
    der:mk('der','Sesgada a la derecha','Como los tiempos de espera: muchos valores chicos y pocos muy grandes.',der),
    pes:mk('pes','Colas pesadas','Casi todos los datos son normales, pero hay algunos valores muy extremos.',pes),
    uni:mk('uni','Aplanada','Todos los valores son igual de probables dentro de un rango.',uni)
  };
  return DS;
}

LABS.cPoi={title:'Pruébalo: Poisson',ctrls:[{id:'l',label:'Promedio de eventos (λ)',min:0.5,max:15,step:0.5,val:6,f:function(x){return fn(x);}},{id:'k',label:'Eventos que buscas (k)',min:0,max:20,step:1,val:4,f:function(x){return String(x);}}],

LABS.cExp={title:'Pruébalo: exponencial',ctrls:[{id:'mean',label:'Espera promedio μ = 1/λ (min)',min:0.5,max:6,step:0.5,val:2,f:function(x){return fn(x);}},{id:'t',label:'Tiempo t (min)',min:0.5,max:10,step:0.5,val:3,f:function(x){return fn(x);}}],

LABS.cNor={title:'Pruébalo: normal',ctrls:[{id:'mu',label:'Promedio (μ)',min:20,max:80,step:1,val:50,f:function(x){return String(x);}},{id:'s',label:'Desviación (σ)',min:2,max:20,step:1,val:10,f:function(x){return String(x);}},{id:'z',label:'Z del límite',min:-3.5,max:3.5,step:0.05,val:1.5,f:function(x){return fmt(x,2);}}],
  top:function(v){var o=[['cola','P(X > x)'],['1','±1σ'],['2','±2σ'],['3','±3σ']],h='<div class="seg" role="group" aria-label="Qué área mostrar">';

LABS.cNorm={title:'Pruébalo con datos',ctrls:[],
  top:function(v){var D=datasets(),h='<div class="seg" role="group" aria-label="Conjunto de datos">';

  draw:function(v){var d=datasets()[v.ds],st=d.st,issues=[];

       '<div class="verdict '+(ok?'ok':'bad')+'">'+(ok?'Compatible con una normal: asimetría y exceso de curtosis cerca de 0, y media parecida a la mediana.':'No parece normal: '+issues.join(' y ')+'.')+'</div>';

function conceptHTML(tab,scope){

  h+='</div><div class="cpt">';
  if(tab==='va'){
    h+='<h3>Variable aleatoria</h3><div class="cards">'+
     '<div class="panel"><h3>Discreta</h3><p>Una variable aleatoria discreta X es una función que asigna un número a cada resultado de un experimento aleatorio. Sus valores posibles son finitos o infinitos numerables: se pueden contar (0, 1, 2, 3…).</p><p class="simple"><b>En simple:</b> se cuenta. Ejemplo: cuántas llamadas contestan o cuántas troncales están dañadas.</p></div>'+
     '<div class="panel"><h3>Continua</h3><p><b>Definición formal.</b> Una variable aleatoria continua X es una función que asigna un número real a cada resultado de un experimento aleatorio y cuyo recorrido es un intervalo (o una unión de intervalos) de números reales. Existe una función de densidad f(x) ≥ 0 tal que:</p>'+
     m('P(a ≤ X ≤ b) = ∫<sub>a</sub><sup>b</sup> f(x) dx<br>∫<sub>−∞</sub><sup>∞</sup> f(x) dx = 1')+
     '<p class="simple" style="margin-top:12px"><b>En simple:</b> se mide, no se cuenta. Ejemplo: el tiempo de espera o el jitter en milisegundos.</p>'+
     '<ul><li>La probabilidad es un área bajo la curva de f(x).</li><li>P(X = x) = 0 para cualquier valor exacto, por eso P(a ≤ X ≤ b) = P(a &lt; X &lt; b).</li><li>La acumulada F(x) = P(X ≤ x) va de 0 a 1.</li></ul></div></div>'+
     '<div class="scroll"><table class="tbl"><thead><tr><th></th><th>Discreta</th><th>Continua</th></tr></thead><tbody>'+
     '<tr><td><b>Valores</b></td><td>Se pueden contar</td><td>Cualquier valor de un intervalo</td></tr>'+
     '<tr><td><b>Función</b></td><td>De probabilidad: P(X = k)</td><td>De densidad: f(x)</td></tr>'+
     '<tr><td><b>P(X = x)</b></td><td>Puede ser mayor que 0</td><td>Siempre 0</td></tr>'+
     '<tr><td><b>Cómo se calcula</b></td><td>Con la fórmula o sumando</td><td>Como área bajo la curva</td></tr>'+
     '<tr><td><b>En CallJuCri</b></td><td>Salas 1, 2 y 3</td><td>Salas 4 y 5</td></tr></tbody></table></div>';
  }else if(tab==='bin'){
    h+='<div class="txt"><h3>Distribución binomial</h3><p class="simple"><b>En simple:</b> cuenta cuántos “sí” salen en varios intentos iguales. Es la de la sala 1.</p><h4>Características</h4><ul><li>Hay n ensayos fijos y cada uno es independiente.</li><li>Cada ensayo tiene solo dos resultados: éxito o fracaso.</li><li>La probabilidad de éxito p es la misma en todos.</li><li>Se escribe X ∼ Bin(n, p) y toma valores 0, 1, …, n.</li><li>Media np y varianza np(1 − p).</li></ul>'+m('P(X = k) = C(n, k) · p<sup>k</sup> · (1 − p)<sup>n−k</sup>')+'</div>';
  }else if(tab==='hip'){
    h+='<div class="txt"><h3>Distribución hipergeométrica</h3><p class="simple"><b>En simple:</b> es como la binomial, pero sacando sin devolver lo que sacaste. Es la de la sala 2.</p><h4>Características</h4><ul><li>La población es finita: N elementos, de los cuales K tienen la característica buscada.</li><li>Se saca una muestra de n elementos sin reemplazo.</li><li>Los ensayos no son independientes: la probabilidad cambia en cada extracción.</li><li>Se escribe X ∼ Hipergeométrica(N, K, n). Media nK/N.</li><li>Si N es muy grande frente a n, se parece a la binomial.</li></ul>'+m('P(X = k) = '+frac('C(K, k) · C(N − K, n − k)','C(N, n)'))+'</div>';
  }else if(tab==='poi'){
    h+='<div class="txt"><h3>Distribución de Poisson</h3><p class="simple"><b>En simple:</b> cuenta cuántas veces pasa algo en un tiempo (o espacio) fijo, como las llamadas que entran en un minuto. Es la de la sala 3.</p><h4>Características</h4><ul>'+
     '<li><b>Qué modela:</b> el número de eventos en un intervalo fijo de tiempo, longitud, área o volumen.</li>'+
     '<li><b>Condiciones:</b> los eventos ocurren de forma independiente, a una tasa promedio constante, y no ocurren dos exactamente al mismo instante.</li>'+
     '<li><b>Tipo:</b> variable discreta. Toma los valores 0, 1, 2, 3… sin un máximo.</li>'+
     '<li><b>Un solo parámetro:</b> λ &gt; 0, el promedio de eventos en el intervalo.</li>'+
     '<li><b>Media = varianza = λ.</b> Por eso la desviación es √λ.</li>'+
     '<li><b>Intervalo distinto:</b> si λ es por minuto y miras t minutos, usa λ · t.</li>'+
     '<li><b>Forma:</b> sesgada a la derecha si λ es chico; se parece a una campana si λ es grande.</li>'+
     '<li><b>Relaciones:</b> aproxima a la binomial con n grande y p chica (λ = np). Los tiempos entre eventos de un proceso de Poisson siguen una exponencial.</li></ul>'+m('P(X = k) = '+frac('e<sup>−λ</sup> · λ<sup>k</sup>','k!')+' , k = 0, 1, 2, …')+'</div>'+labHTML('cPoi',scope);
  }else if(tab==='exp'){
    h+='<div class="txt"><h3>Distribución exponencial</h3><p class="simple"><b>En simple:</b> mide cuánto hay que esperar hasta que pase algo, como el tiempo de un cliente en la cola. Es la de la sala 4.</p><h4>Características</h4><ul>'+
     '<li><b>Qué modela:</b> el tiempo hasta el primer evento, o entre dos eventos seguidos, cuando los eventos ocurren a tasa constante (un proceso de Poisson).</li>'+
     '<li><b>Tipo:</b> variable continua con X ≥ 0.</li>'+
     '<li><b>Un solo parámetro:</b> la tasa λ &gt; 0. El tiempo promedio es μ = 1/λ.</li>'+
     '<li><b>Media = 1/λ, varianza = 1/λ²,</b> y la desviación también vale 1/λ.</li>'+
     '<li><b>Forma:</b> siempre decrece, con el valor más alto en 0 y cola larga a la derecha.</li>'+
     '<li><b>Falta de memoria:</b> P(X &gt; s + t | X &gt; s) = P(X &gt; t). Haber esperado ya s minutos no cambia lo que falta.</li>'+
     '<li><b>No confundir:</b> λ es la tasa (por minuto) y μ es el tiempo promedio (minutos). En la sala 4, μ = 2 y λ = 0,5.</li></ul>'+
     m('f(x) = λ · e<sup>−λx</sup> , x ≥ 0<br>F(x) = P(X ≤ x) = 1 − e<sup>−λx</sup><br>P(X &gt; t) = e<sup>−λt</sup>')+'</div>'+labHTML('cExp',scope);
  }else if(tab==='nor'){
    h+='<div class="txt"><h3>Distribución normal</h3><p class="simple"><b>En simple:</b> la campana. La mayoría de los datos están cerca del promedio y cada vez hay menos hacia los lados. Es la de la sala 5.</p><h4>Características</h4><ul>'+
     '<li>Variable continua con forma de campana, con un solo pico y simétrica respecto a μ.</li>'+
     '<li>Media = mediana = moda = μ.</li>'+
     '<li>Dos parámetros: μ (el centro) y σ (qué tan abierta es la campana).</li>'+
     '<li>El área total es 1 y la curva se acerca al eje sin tocarlo.</li>'+
     '<li>Cambia de curvatura en μ − σ y μ + σ (puntos de inflexión).</li>'+
     '<li><b>Regla empírica:</b> cerca del 68 % de los datos queda entre μ ± σ, cerca del 95 % entre μ ± 2σ y cerca del 99,7 % entre μ ± 3σ.</li>'+
     '<li><b>Estandarización:</b> Z = (X − μ)/σ convierte cualquier normal en una N(0, 1), y así se usa una sola tabla.</li>'+
     '<li>Asimetría 0 y curtosis 3.</li></ul>'+
     m('f(x) = '+frac('1','σ √(2π)')+' · e<sup>−(x − μ)² / (2σ²)</sup> , −∞ &lt; x &lt; ∞')+
     '<h4>Aplicaciones</h4><ul>'+
     '<li><b>Medidas de personas y de la naturaleza:</b> estatura, peso, presión arterial, aproximadamente.</li>'+
     '<li><b>Errores de medición y control de calidad:</b> tamaño de piezas, llenado de envases, límites de control con ± 3σ.</li>'+
     '<li><b>Notas y pruebas estandarizadas:</b> puntajes Z y percentiles.</li>'+
     '<li><b>Telecomunicaciones:</b> el ruido en un canal suele modelarse como normal. En este proyecto se supone también para el jitter.</li>'+
     '<li><b>Inferencia estadística:</b> por el teorema del límite central, los promedios de muchos datos se parecen a una normal. De ahí salen los intervalos de confianza y las pruebas de hipótesis.</li>'+
     '<li><b>Aproximar otras distribuciones:</b> la binomial y la de Poisson cuando los valores son grandes.</li>'+
     '<li><b>Finanzas:</b> se usa para modelar rendimientos, aunque en la práctica tienen colas más pesadas.</li></ul></div>'+labHTML('cNor',scope);
  }else{
    h+='<div class="txt"><h3>¿Mis datos son normales?</h3><p class="simple"><b>En simple:</b> antes de usar la normal hay que comprobar que los datos tengan forma de campana. Eso es lo que se hace al inicio de la sala 5.</p></div>'+
     '<div class="cards">'+
     '<div class="panel"><h3>Asimetría</h3><p>Dice qué tan chueca es la distribución.</p>'+m('g<sub>1</sub> = '+frac('m<sub>3</sub>','m<sub>2</sub><sup>3/2</sup>'))+'<p style="margin-top:10px">con m<sub>r</sub> = Σ f<sub>i</sub>(x<sub>i</sub> − μ)<sup>r</sup> / N</p><ul><li>Cerca de 0: simétrica, como la normal.</li><li>Positiva: cola larga a la derecha.</li><li>Negativa: cola larga a la izquierda.</li><li>Guía práctica: |g₁| &lt; 0,5 es casi simétrica.</li></ul></div>'+
     '<div class="panel"><h3>Curtosis</h3><p>Dice qué tan pesadas son las colas y qué tan puntiaguda es la campana.</p>'+m('g<sub>2</sub> = '+frac('m<sub>4</sub>','m<sub>2</sub><sup>2</sup>'))+'<p style="margin-top:10px">Para la normal g₂ = 3. El exceso es g₂ − 3.</p><ul><li>Exceso cerca de 0: mesocúrtica, como la normal.</li><li>Exceso positivo: leptocúrtica, colas pesadas.</li><li>Exceso negativo: platicúrtica, más aplanada.</li><li>Guía práctica: exceso entre −1 y 1.</li></ul></div>'+
     '<div class="panel"><h3>Comportamiento gráfico</h3><ul><li><b>Histograma:</b> un solo pico y simétrico, con forma de campana.</li><li><b>Diagrama de caja:</b> la mediana al centro y los bigotes parecidos a cada lado.</li><li><b>Gráfico Q-Q:</b> los puntos siguen la recta. Si se curvan, hay asimetría; si se abren en las puntas, hay colas pesadas.</li><li><b>Media y mediana:</b> casi iguales.</li></ul></div></div>'+
     '<div class="txt"><p>Son reglas prácticas, no una prueba formal. Para algo más riguroso existen pruebas como Shapiro–Wilk.</p></div>'+labHTML('cNorm',scope);
  }
  return h+'</div>';
}

    h+='<div class="txt"><p>Es martes, 8:00 a. m. El ingeniero de sistemas Cristian y la ingeniera de sistemas Juana manejan el sistema de llamadas de CallJuCri, un call center con miles de llamadas diarias. De repente la planta telefónica colapsa: las troncales fallan, las llamadas salientes no conectan y los clientes se acumulan en cola.</p><p>Cada sala del sistema es un subsistema crítico que hay que estabilizar. Para reiniciar la planta, el sistema pide una clave que solo se obtiene analizando los datos. Si no logran restaurarla antes de que se agote el tiempo, la empresa pierde toda la operación del día.</p></div>';
  }else if(tab==='problema'){
    h+='<div class="txt"><p>En un centro de llamadas con telefonía IP (VoIP) pueden aparecer fallas que afectan la atención: llamadas que logran conectarse, fallas en los canales, la cantidad de llamadas en las horas de mayor actividad, los tiempos de espera y la calidad del sonido.</p><p>Cuando ocurre una falla grave en la planta de CallJuCri, los ingenieros no pueden reiniciar los servidores sin saber qué pasa. Primero deben revisar cada parte del sistema, comprobar si los datos cumplen las condiciones para calcular, y así encontrar las respuestas antes de que termine el tiempo.</p><p>La probabilidad y la estadística permiten entender por qué se presentan estas fallas y buscar cómo mejorar el funcionamiento del sistema.</p></div>';
  }else if(tab==='conceptos'){
    h+=conceptHTML(S.ctab,scope);
  }else if(tab==='glosario'){
    h+='<div class="scroll"><table class="tbl"><thead><tr><th>Concepto</th><th>Área</th><th>Definición</th></tr></thead><tbody>';
    GLOS.forEach(function(g){h+='<tr><td><b>'+g[0]+'</b></td><td>'+g[1]+'</td><td>'+g[2]+'</td></tr>';});
    h+='</tbody></table></div>';
  }else{
    h+='<div class="txt"><h4>Reglas</h4><ul><li><b>Claves:</b> cada respuesta es una probabilidad redondeada a 4 decimales. Se escribe sin el cero y sin la coma. Si el resultado es 0,2668, la clave es 2668.</li><li><b>Orden:</b> las salas se resuelven en orden. No pasas a la siguiente sin desbloquear la actual.</li><li><b>Pistas:</b> cada sala tiene 2. La primera dice qué distribución usar y la segunda muestra la fórmula.</li><li><b>Tiempo e intentos:</b> 25 minutos en total y máximo 3 intentos por sala antes de que se bloquee unos segundos.</li></ul>'+
       '<h4>Dificultad</h4><ul><li><b>Básico (salas 1 y 2):</b> reemplazar los números del problema en la fórmula.</li><li><b>Medio (salas 3 y 4):</b> distinguir cuántas llamadas llegan por minuto (λ) de cuánto espera un cliente en promedio (μ).</li><li><b>Alto (sala 5 y puerta final):</b> revisar que los datos tengan forma de campana, calcular la probabilidad y juntar las 5 claves.</li></ul></div>'+
       '<div class="scroll"><table class="tbl"><thead><tr><th>Sala</th><th>Subsistema</th><th>Qué hay que calcular</th></tr></thead><tbody>'+
       '<tr><td>1</td><td>Campaña saliente (marcador predictivo)</td><td>Probabilidad de exactamente k llamadas contestadas</td></tr>'+
       '<tr><td>2</td><td>Troncales SIP</td><td>Probabilidad de hallar k troncales dañadas al probar una muestra</td></tr>'+
       '<tr><td>3</td><td>Hora pico (entrantes)</td><td>Probabilidad de exactamente k llamadas en un minuto</td></tr>'+
       '<tr><td>4</td><td>Cola de espera</td><td>Probabilidad de que un cliente espere más de t minutos</td></tr>'+
       '<tr><td>5</td><td>Calidad de voz (jitter)</td><td>Proporción de paquetes fuera del límite de calidad</td></tr>'+
       '<tr><td>Final</td><td>Reinicio de la planta</td><td>Ingresar las 5 claves juntas</td></tr></tbody></table></div>';
  }
  return h;
}

/* ---------- vistas ---------- */
function introView(){
  return '<section class="hero"><div class="status"><i></i>Martes, 8:00 a. m. · Planta telefónica caída</div>'+
   '<h1>Caída del Call Center</h1>'+
   '<p class="lead">Eres parte del equipo técnico de CallJuCri. Cada sala es un subsistema roto y cada respuesta correcta te da una clave. Con las cinco claves reinicias la planta.</p>'+
   '<div class="cta"><button class="btn primary big" type="button" data-act="start">Iniciar emergencia</button><div class="chips"><span class="chip">5 salas</span><span class="chip">25 minutos</span><span class="chip">3 intentos por sala</span></div></div></section>'+
   '<section aria-label="Manual del juego">'+manualHTML(S.tab,'intro')+'</section>'+
   '<footer class="credits">Juana Valentina Villamil Mora · Cristian David<br>Estadística y Probabilidad · Fundación Universitaria Unimonserrate<br>Profesora Nicole Steffany Melo Martinez · Noviembre 2026</footer>';
}
function strip(){
  var h='<nav class="strip" aria-label="Salas">',i,pct=Math.round((nSolved()+(S.view==='win'?1:0))/6*100);
  for(i=0;i<6;i++){
    var cls='node'+(S.solved[i]||(i===5&&S.view==='win')?' ok':'')+(S.cur===i?' cur':'');
    h+='<button type="button" class="'+cls+'" data-act="goto" data-i="'+i+'"'+(avail(i)?'':' disabled')+' aria-label="'+(i<5?'Sala '+(i+1):'Puerta final')+'"'+(S.cur===i?' aria-current="step"':'')+'><span class="dot">'+(S.solved[i]?'✓':'')+'</span>'+(i<5?'S'+(i+1):'Final')+'</button>';
  }
  h+='</nav><div class="prog" role="progressbar" aria-label="Planta operativa" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><span>Planta operativa '+pct+' %</span><div class="track"><i data-w="'+pct+'" style="width:'+S.prevPct+'%"></i></div></div><div class="keys"><span>Claves:</span>';
  for(i=0;i<5;i++)h+=S.solved[i]?'<span class="key">'+rooms[i].key+'</span>':'<span class="key empty">····</span>';
  return h+'</div>';
}
function answerForm(i,isFinal){
  var now=Date.now(),locked=S.lock[i]>now,a=S.att[i],dots='',k,tot=isFinal?20:4;
  for(k=0;k<3;k++)dots+='<i class="'+(k<a?'':'off')+'"></i>';
  return '<form class="answer'+(S.shake?' shake':'')+'" id="f" autocomplete="off"><label for="clave">'+(isFinal?'Las 5 claves juntas':'Clave de la sala')+'</label>'+
   '<div class="help">'+(isFinal?'Escríbelas en orden, de la sala 1 a la 5, sin espacios.':'Redondea a 4 decimales y quita el cero y la coma. Ejemplo: 0,2668 se escribe 2668.')+'</div>'+
   '<div class="row"><input type="text" id="clave" inputmode="numeric" '+(locked?'disabled ':'')+'placeholder="'+(isFinal?'20 dígitos':'4 dígitos')+'" aria-describedby="msg"><button class="btn primary" type="submit"'+(locked?' disabled':'')+'>Ingresar</button>'+
   (S.demo?'<button class="btn" type="button" data-act="fill">Rellenar clave</button>':'')+'</div>'+
   '<div class="att"><span>'+dots+'</span>'+a+' intento'+(a===1?'':'s')+' restante'+(a===1?'':'s')+'<span class="cnt" id="cnt">0 de '+tot+' dígitos</span></div>'+
   '<div class="msg'+(locked?' lock':'')+'" id="msg" aria-live="polite">'+(locked?'Sala bloqueada. Se reabre en <span id="lockmsg">'+Math.ceil((S.lock[i]-now)/1000)+'</span> s.':S.msg)+'</div></form>';
}
function roomView(i){
  var r=rooms[i],done=S.solved[i],h='<section class="room">';
  h+='<div class="eyebrow">Sala '+r.n+' de 5</div><h1>'+r.title+'</h1><p class="sub">Subsistema: '+r.sub+'</p>';
  h+='<div class="chips"><span class="chip lvl">Nivel '+r.lvl+'</span>'+((S.hints[i]>=1||done)?'<span class="chip">Modelo: '+r.model+'</span>':'')+'</div>';
  h+='<div class="split"><div class="problem">'+r.problem+'</div>'+fxCard(i)+'</div>';
  if(r.table){
    h+='<div class="scroll"><table class="tbl"><thead><tr><th>Jitter (ms)</th><th class="n">Frecuencia</th><th class="n">Marca de clase</th></tr></thead><tbody>';
    JIT.forEach(function(x){h+='<tr><td>'+x[0]+'</td><td class="n">'+x[1]+'</td><td class="n">'+x[2]+'</td></tr>';});
    h+='<tr><td><b>Total</b></td><td class="n"><b>70</b></td><td></td></tr></tbody></table></div>';
    h+='<div class="block"><h3>¿Tiene forma de campana?</h3>'+histo()+'<p class="cap">Histograma de los 70 paquetes. Pasa el cursor por una barra para ver su frecuencia.</p></div>';
    h+='<div class="problem">'+r.problem2+'</div>';
  }
  if(!done){
    h+='<div class="hints" aria-live="polite">';
    for(var k=0;k<S.hints[i];k++)h+='<div class="hint"><b>Pista '+(k+1)+'</b>'+r.hints[k]+'</div>';
    h+='</div>';
    if(S.hints[i]<2)h+='<div class="hintbar"><button class="btn sm" type="button" data-act="hint">Pedir pista '+(S.hints[i]+1)+'</button><span class="cap" style="margin:0">'+(2-S.hints[i])+' disponible'+(S.hints[i]===0?'s':'')+'</span></div>';
    h+=answerForm(i,false);
  }else{
    var len=r.steps.length,rev=S.rev[i]==null?len:S.rev[i],j;
    h+='<div class="okbar'+(S.justSolved===i?' pop':'')+'"><p>Sala estabilizada. Clave de la sala:</p><div class="big">'+r.key+'</div></div>';
    h+='<div class="solution"><h2 style="font-size:20px;margin-bottom:14px">Solución paso a paso</h2><ol class="steps">';
    for(j=0;j<rev;j++){var s=r.steps[j];h+='<li'+(S.newStep===j?' class="new"':'')+'><div><h3>'+s[0]+'</h3>'+(s[1].charAt(0)==='<'?s[1]:'<p style="margin:0">'+s[1]+'</p>')+'</div></li>';}
    h+='</ol>';
    if(rev<len)h+='<div class="stepbar"><button class="btn primary" type="button" data-act="step">Mostrar el paso '+(rev+1)+' de '+len+'</button><button class="btn sm" type="button" data-act="allsteps">Mostrar todo</button></div>';
    else h+='<div class="block">'+labHTML('r'+r.n,'game')+'</div>';
    h+='</div><div class="nav"><button class="btn primary" type="button" data-act="next">'+(i<4?'Ir a la sala '+(i+2):'Ir a la puerta final')+'</button></div>';
  }
  return h+'</section>';
}
function finalView(){
  var h='<section class="room"><div class="eyebrow">Puerta final</div><h1>Reinicio de la planta</h1><p class="sub">Nivel Alto · Combinación de las 5 claves</p>';
  h+='<div class="problem"><p>Las cinco salas están estables. Para reiniciar la planta, ingresa las claves obtenidas una detrás de otra, en el orden de las salas.</p></div>';
  h+='<div class="final-keys">';rooms.forEach(function(r,i){h+='<span class="key">S'+(i+1)+' · '+r.key+'</span>';});h+='</div>';
  return h+answerForm(5,true)+'</section>';
}
function winView(){
  var used=TOTAL-(S.endAt-S.doneAt),h='<section class="win"><div class="lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><div class="status" style="color:var(--ok)">Planta en línea</div><h1>Planta restablecida</h1>';
  h+='<p class="lead" style="color:var(--muted);max-width:56ch;font-size:18px">Las troncales vuelven a conectar, la cola se vacía y CallJuCri retoma la operación del día. Tiempo usado: <b style="color:var(--fg);font-family:var(--f-mono)">'+mmss(used)+'</b> de 25:00.</p>';
  h+='<div class="eyebrow" style="margin-top:22px">Clave de reinicio</div><div class="bigkey">'+FINAL+'</div>';
  h+='<div class="block"><h3>Resumen de las salas</h3><div class="scroll"><table class="tbl mono"><thead><tr><th>Sala</th><th>Subsistema</th><th>Modelo</th><th class="n">Probabilidad</th><th class="n">Clave</th></tr></thead><tbody>';
  rooms.forEach(function(r){h+='<tr><td>'+r.n+'</td><td style="font-family:var(--f-body)">'+r.sub+'</td><td style="font-family:var(--f-body)">'+r.model+'</td><td class="n">'+fmt(r.prob)+'</td><td class="n"><b>'+r.key+'</b></td></tr>';});
  h+='</tbody></table></div></div>';
  h+='<div class="concl"><h2>Conclusiones</h2><ul>'+
   '<li><b>Cada situación pide su modelo.</b> Binomial si los ensayos son independientes con p constante ('+fmt(rooms[0].prob)+'); hipergeométrica si se muestrea sin reemplazo de una población finita ('+fmt(rooms[1].prob)+').</li>'+
   '<li><b>Conteos y tiempos no son lo mismo.</b> Poisson cuenta llamadas por minuto ('+fmt(rooms[2].prob)+'); la exponencial mide cuánto se espera hasta ser atendido ('+fmt(rooms[3].prob)+'). Ambas usan la tasa λ.</li>'+
   '<li><b>Antes de usar la normal hay que verificarla.</b> El jitter es simétrico (asimetría '+sg(fmt(JM.g1,2))+'), y con μ = 32,5 ms y σ ≈ 6,6548 ms solo cerca del 3 % de los paquetes supera los 45 ms ('+fmt(rooms[4].prob)+').</li>'+
   '<li><b>La probabilidad ayuda a decidir.</b> Interpretar estos valores permite priorizar revisiones en la planta en lugar de actuar a ciegas.</li>'+
   '<li><b>El juego cumple su objetivo:</b> pasar de reemplazar valores en una fórmula a verificar supuestos, estandarizar e interpretar, con las cinco claves integradas en un solo reto.</li></ul></div>';
  h+='<div class="cta"><button class="btn primary" type="button" data-act="again">Jugar de nuevo</button><button class="btn" type="button" data-act="goto" data-i="0">Repasar las soluciones</button></div></section>';
  return h;
}
function loseView(){
  return '<section class="win"><div class="status"><i></i>Sin conexión</div><h1>Se agotó el tiempo</h1><p class="lead" style="color:var(--muted);max-width:56ch;font-size:18px">La planta no alcanzó a reiniciarse y la empresa perdió la operación del día. Puedes volver a intentarlo desde la primera sala.</p><div class="cta"><button class="btn primary" type="button" data-act="again">Intentar de nuevo</button></div></section>';
}

function render(focus){
  var app=document.getElementById('app'),h;
  if(S.view==='intro')h=introView();
  else if(S.view==='room')h=strip()+roomView(S.cur);
  else if(S.view==='final')h=strip()+finalView();
  else if(S.view==='win')h=S.review?strip()+roomView(S.cur):winView();
  else h=loseView();
  app.innerHTML=h;
  document.getElementById('timerbox').hidden=!(S.view==='room'||S.view==='final');
  var md=document.getElementById('modal');
  if(S.modal){md.hidden=false;md.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="Manual"><header><h2>Manual</h2><button class="btn sm" type="button" data-act="close">Cerrar</button></header>'+manualHTML(S.mtab,'modal')+'</div>';}
  else{md.hidden=true;md.innerHTML='';}
  var bar=document.querySelector('.prog i');
  if(bar){var tg=bar.getAttribute('data-w');requestAnimationFrame(function(){bar.style.width=tg+'%';});S.prevPct=+tg;}
  S.newStep=-1;S.shake=false;S.justSolved=-1;
  if(focus&&!S.modal){var inp=document.getElementById('clave');if(inp&&!inp.disabled)inp.focus({preventScroll:true});}
}
function refreshLab(id){
  var L=LABS[id],v=S.lab[id],d=L.draw(v),roots=document.querySelectorAll('[data-labroot="'+id+'"]');
  Array.prototype.forEach.call(roots,function(root){
    var tp=root.querySelector('.labtop');if(tp)tp.innerHTML=L.top?L.top(v):'';
    root.querySelector('.labout').innerHTML=d.out;
    root.querySelector('.labchart').innerHTML=d.chart;
    L.ctrls.forEach(function(c){var b=root.querySelector('[data-val="'+c.id+'"]');if(b)b.textContent=c.f(v[c.id]);});
  });
}
function top(){window.scrollTo(0,0);}
function start(){var d=S.demo;S=fresh();S.demo=d;S.view='room';S.endAt=Date.now()+TOTAL;document.getElementById('timer').textContent='25:00';top();render(true);}

/* ---------- eventos ---------- */
function norm(s){s=String(s).trim().replace(/^0\s*[,.]\s*/,'');var d=s.replace(/\D/g,'');return (d.length&&d.length<4)?('0000'+d).slice(-4):d;}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act');
  if(a==='start')start();
  else if(a==='tab'){if(b.getAttribute('data-scope')==='modal')S.mtab=b.getAttribute('data-v');else S.tab=b.getAttribute('data-v');render(false);}
  else if(a==='ctab'){S.ctab=b.getAttribute('data-v');render(false);}
  else if(a==='mode'){S.lab.cNor.mode=b.getAttribute('data-v');refreshLab('cNor');}
  else if(a==='ds'){S.lab.cNorm.ds=b.getAttribute('data-v');refreshLab('cNorm');}
  else if(a==='manual'){S.modal=true;render(false);}
  else if(a==='close'){S.modal=false;render(false);}
  else if(a==='hint'){S.hints[S.cur]++;render(false);}
  else if(a==='step'){var i0=S.cur;S.rev[i0]=(S.rev[i0]==null?rooms[i0].steps.length:S.rev[i0])+1;S.newStep=S.rev[i0]-1;render(false);var nw=document.querySelector('.steps li.new');if(nw&&nw.scrollIntoView)nw.scrollIntoView({block:'nearest',behavior:'smooth'});}
  else if(a==='allsteps'){S.rev[S.cur]=rooms[S.cur].steps.length;render(false);}
  else if(a==='goto'){var i=+b.getAttribute('data-i');if(S.view==='win'){S.review=(i<5);S.cur=i;}else{if(!avail(i))return;S.cur=i;S.view=i===5?'final':'room';}S.msg='';top();render(true);}
  else if(a==='next'){var n=S.cur+1;S.cur=n;if(S.view==='win'){S.review=(n<5);}else{S.view=n===5?'final':'room';}S.msg='';top();render(true);}
  else if(a==='fill'){var el=document.getElementById('clave');if(el){el.value=S.cur===5?FINAL:rooms[S.cur].key;el.dispatchEvent(new Event('input',{bubbles:true}));el.focus();}}
  else if(a==='again'){var d=S.demo;S=fresh();S.demo=d;S.view='intro';document.getElementById('timer').textContent='25:00';top();render(false);}
});
document.addEventListener('input',function(e){
  var t=e.target;if(!t||!t.getAttribute)return;
  var lab=t.getAttribute('data-lab');
  if(lab){S.lab[lab][t.getAttribute('data-c')]=parseFloat(t.value);refreshLab(lab);}
  else if(t.id==='clave'){var c=document.getElementById('cnt');if(c)c.textContent=t.value.replace(/\D/g,'').length+' de '+(S.cur===5?20:4)+' dígitos';}
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var i=S.cur,el=document.getElementById('clave');if(!el||S.lock[i]>Date.now())return;
  var ok=(i===5)?(el.value.replace(/\D/g,'')===FINAL):(norm(el.value)===rooms[i].key);
  if(ok){
    S.msg='';
    if(i===5){S.doneAt=Date.now();S.view='win';S.review=false;S.cur=5;for(var q=0;q<5;q++)S.rev[q]=null;top();render(false);return;}
    S.solved[i]=true;S.rev[i]=1;S.newStep=0;S.justSolved=i;render(false);
    var ob=document.querySelector('.okbar');if(ob&&ob.scrollIntoView)ob.scrollIntoView({block:'center'});
  }else{
    S.att[i]--;S.shake=true;
    if(S.att[i]<=0){S.lock[i]=Date.now()+10000;S.msg='';}
    else S.msg='Clave incorrecta. Revisa el cálculo y el formato.';
    render(true);
  }
});
document.getElementById('demo').addEventListener('change',function(e){S.demo=e.target.checked;render(false);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.modal){S.modal=false;render(false);}});
setInterval(function(){
  if(S.view!=='room'&&S.view!=='final')return;
  var now=Date.now(),rem=S.endAt-now;
  if(rem<=0){S.view='lose';S.modal=false;render(false);return;}
  var t=document.getElementById('timer');t.textContent=mmss(rem);t.parentElement.classList.toggle('low',rem<5*60000);
  var i=S.cur;
  if(S.lock[i]){var l=S.lock[i]-now;if(l<=0){S.lock[i]=0;S.att[i]=3;S.msg='';render(true);}else{var e=document.getElementById('lockmsg');if(e)e.textContent=Math.ceil(l/1000);}}
},250);
render(false);
})();
</script>

</body></html>
